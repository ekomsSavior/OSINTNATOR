# Load inside the existing http{} context. Unique zones affect only this host.
limit_req_zone $binary_remote_addr zone=osint_per_ip:2m rate=5r/s;
limit_req_zone $server_name zone=osint_total:1m rate=40r/s;
limit_conn_zone $binary_remote_addr zone=osint_connections:2m;
limit_conn_zone $server_name zone=osint_total_connections:1m;
# Generated from the host's existing Cloudflare proxy allowlist at deployment.
geo $realip_remote_addr $osint_cloudflare_peer {
    default 0;
    127.0.0.1 1;
    ::1 1;
    include /etc/osintnator/cloudflare-peers.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name osint.churchofmalware.org;
    if ($osint_cloudflare_peer = 0) { return 444; }
    access_log off;
    return 301 https://osint.churchofmalware.org$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name osint.churchofmalware.org;
    ssl_certificate /etc/ssl/gitea/cert.pem;
    ssl_certificate_key /etc/ssl/gitea/key.pem;
    include /opt/church-matrix/cloudflare-real-ip.conf;
    if ($osint_cloudflare_peer = 0) { return 444; }
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/osint-error.log crit;
    client_max_body_size 8k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    large_client_header_buffers 2 8k;
    keepalive_timeout 15s;
    send_timeout 10s;
    limit_req zone=osint_per_ip burst=12 nodelay;
    limit_req zone=osint_total burst=20 nodelay;
    limit_req_status 429;
    limit_conn osint_connections 8;
    limit_conn osint_total_connections 64;
    limit_conn_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        limit_except GET POST DELETE { deny all; }
        proxy_pass http://unix:/run/osintnator/api.sock;
        proxy_set_header Host osint.churchofmalware.org;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Authorization "";
        proxy_read_timeout 15s;
        proxy_send_timeout 10s;
        proxy_connect_timeout 2s;
        proxy_cache off;
    }
}
